name: Android signed release APK
# Needs repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - name: Test signing safeguards
        run: python3 -m unittest discover -s scripts -p 'test_android_release.py' -v
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py --check-secrets
      - name: Upgrade npm
        run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      - name: Build Web Assets
        run: npm run build
      - name: Fix Capacitor Web Directory Path
        run: |
          echo "Searching for index.html..."
          # index.html ရှိတဲ့ ဖိုဒါကို ရှာပါမယ်
          INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
          
          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: Could not find index.html anywhere!"
            exit 1
          fi
          
          # ဖိုင်တွေ ရှိတဲ့ ဖိုဒါကို ရှာပါ (ဥပမာ - dist, dist/client, build)
          WEB_DIR=$(dirname "$INDEX_PATH")
          # လမ်းကြောင်းအပြည့်အစုံကနေ './' ကို ဖြတ်ထုတ်ပါမယ်
          CLEAN_DIR=${WEB_DIR#./}
          
          echo "Found index.html in: $CLEAN_DIR"
          echo "Updating capacitor.config.ts webDir to: $CLEAN_DIR"
          
          # capacitor.config.ts ဖိုင်ထဲက webDir ကို ရှာတွေ့တဲ့ ဖိုဒါနဲ့ အစားထိုးပါမယ်
          sed -i "s|webDir: *['\"].*['\"]|webDir: '$CLEAN_DIR'|" capacitor.config.ts
          
          echo "Updated capacitor.config.ts:"
          grep -i webDir capacitor.config.ts
      - name: Build bundled app and prepare Android
        run: bash scripts/android-setup.sh
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: justus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
