name: Android signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      
      - name: Test signing safeguards
        run: python3 -m unittest discover -s scripts -p 'test_android_release.py' -v
        
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py --check-secrets
        
      - name: Install Dependencies
        run: |
          npm install -g npm@11
          npm install --no-audit --no-fund
          
      - name: Build Web App and Force into Dist
        run: |
          # 1. Run the build (this might create the files in a different folder)
          npm run build || CAPACITOR=1 npx vite build
          
          # 2. Create the dist folder if it doesn't exist
          mkdir -p dist
          
          # 3. If index.html is not in dist, search the whole project for it and copy it
          if [ ! -f "dist/index.html" ]; then
            echo "index.html is missing from dist. Searching for it..."
            FOUND_INDEX=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
            
            if [ -n "$FOUND_INDEX" ]; then
              echo "Found at $FOUND_INDEX. Copying to dist..."
              cp -r "$(dirname "$FOUND_INDEX")"/* dist/
            else
              echo "CRITICAL ERROR: Cannot find index.html anywhere!"
              exit 1
            fi
          fi
          
      - name: Force Capacitor Config to Dist
        run: |
          # Force capacitor.config.ts to point exactly to 'dist'
          sed -i "s|webDir: *['\"].*['\"]|webDir: 'dist'|" capacitor.config.ts
          
      - name: Add and Sync Android directly
        run: |
          # Bypass the custom scripts and run Capacitor directly
          npx cap add android || true
          npx cap sync android
          
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py
        
      - uses: actions/upload-artifact@v4
        with:
          name: justus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
