name: Android signed release APK
# Needs repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - name: Test signing safeguards
        run: python3 -m unittest discover -s scripts -p 'test_android_release.py' -v
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py --check-secrets
      - name: Upgrade npm
        run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      - name: Build Web Assets
        run: npm run build
      - name: Prepare Capacitor Web Assets
        run: |
          # Build လုပ်ပြီးရင် index.html ကို ရှာပြီး dist ရဲ့ အပေါ်ဆုံးကို ရွှေ့ပါမယ်
          if [ -f "dist/index.html" ]; then
            echo "index.html found in dist/"
          elif [ -f "dist/client/index.html" ]; then
            echo "Found in dist/client, moving to dist/"
            cp -r dist/client/* dist/
          elif [ -f "dist/public/index.html" ]; then
            echo "Found in dist/public, moving to dist/"
            cp -r dist/public/* dist/
          else
            echo "ERROR: Could not find index.html anywhere!"
            ls -R dist
            exit 1
          fi
      - name: Build bundled app and prepare Android
        run: bash scripts/android-setup.sh
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: justus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
