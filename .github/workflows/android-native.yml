
name: Just Us Native APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'justus-kotlin-native/**'
      - '.github/workflows/android-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Native Project
        run: |
          unzip -o justus-kotlin-native-phase1.zip -d .
          mv justus-kotlin-native/* .
          mv justus-kotlin-native/.[!.]* . 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Native Debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: justus-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
