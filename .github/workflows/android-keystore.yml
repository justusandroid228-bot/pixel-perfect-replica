name: Create Android release keystore (run once)
# Needs repo secrets: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, SECRETS_WRITE_TOKEN
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE to make a new signing key (only do this once)
        required: true
permissions:
  contents: read
jobs:
  create:
   # if: ${{ github.event.inputs.confirm == 'CREATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create keystore and save it as a repository secret
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GH_TOKEN; do
            [ -n "${!n}" ] || { echo "Missing secret for $n"; exit 1; }
          done
          if gh secret list -R "$REPO" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            echo "ANDROID_KEYSTORE_BASE64 already exists; refusing to replace the signing key."; exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/ks"
          ks="$RUNNER_TEMP/ks/justus-release.jks"
          keytool -genkeypair -keystore "$ks" -storetype JKS -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Just Us" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD >/dev/null
          base64 -w0 "$ks" | gh secret set ANDROID_KEYSTORE_BASE64 -R "$REPO"
          echo "ANDROID_KEYSTORE_BASE64 saved."
      - name: Upload password-protected keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: justus-keystore-backup
          path: ${{ runner.temp }}/ks/justus-release.jks
          retention-days: 1
          if-no-files-found: error
      - name: Remove keystore from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks"
