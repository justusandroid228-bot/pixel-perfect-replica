name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build mobile web app
        run: npm run build

      - name: Verify web assets
        run: |
          test -s dist/index.html
          echo "Web assets ready"

      - name: Test Android build paths
        run: bunx vitest run src/test/android-build.test.ts

      - name: Configure and sync Android
        run: bash scripts/android-setup.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: justus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
