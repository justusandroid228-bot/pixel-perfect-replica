name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mobile web app
        run: CAPACITOR=1 npm run build

      - name: Verify web assets
        run: |
          test -s .output/public/index.html
          echo "Web assets ready"

      - name: Configure Capacitor
        run: |
          sed -i -E 's/webDir: *"[^"]+"/webDir: ".output\/public"/' capacitor.config.ts
          cat capacitor.config.ts

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: justus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
