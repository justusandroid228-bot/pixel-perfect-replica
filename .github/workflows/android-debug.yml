name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      
      - name: Upgrade npm
        run: npm install -g npm@11
      
      - run: npm install --no-audit --no-fund
      
      - name: Build Web App
        run: npm run build
        
      - name: Debug and Fix Assets
        run: |
          echo "=== လက်ရှိ Folder တွေ စစ်ထုတ်ခြင်း ==="
          ls -la
          echo "=== dist Folder ရှိမရှိ စစ်ခြင်း ==="
          ls -la dist 2>/dev/null || echo "dist folder မရှိပါ"
          
          # index.html ကို ရှိသမျှ နေရာက ရှာပြီး dist/client ထဲ ကူးထည့်ခြင်း
          mkdir -p dist/client
          find . -name "index.html" -not -path "./node_modules/*" -not -path "./.git/*" -exec cp {} dist/client/ \;
          
          echo "=== ကူးပြီးနောက် dist/client ထဲက ဖိုင်များ ==="
          ls -la dist/client
      
      - name: Add Android Platform
        run: npx cap add android
      
      - run: npx cap sync android
      
      - run: bash scripts/android-setup.sh
      
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
        
      - uses: actions/upload-artifact@v4
        with:
          name: justus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
